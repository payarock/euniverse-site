<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E.Universe株式会社</title>
<meta name="description" content="E.Universe株式会社（愛知県名古屋市中村区）の会社情報。IT・デザイン、ジュエリー、メディア、3Dプリント、ソフトウェア開発。">
<meta name="robots" content="index, follow">
<meta property="og:title" content="E.Universe株式会社">
<meta property="og:description" content="E.Universe株式会社（名古屋市）の会社情報。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://euniverse.co.jp/">
<style>
  :root{
    --ink:#1a1a1a;
    --muted:#6b6b6b;
    --line:#e2e2e2;
    --bg:#ffffff;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    font-size:16px;
    line-height:1.9;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:80px 24px 96px;
  }
  header{
    padding-bottom:40px;
    border-bottom:1px solid var(--line);
  }
  h1{
    margin:0 0 6px;
    font-size:26px;
    font-weight:600;
    letter-spacing:.04em;
  }
  .en{
    margin:0;
    font-size:13px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
  }
  h2{
    margin:56px 0 20px;
    font-size:13px;
    font-weight:600;
    letter-spacing:.16em;
    color:var(--muted);
  }
  dl{
    margin:0;
    display:grid;
    grid-template-columns:8em 1fr;
    gap:14px 24px;
  }
  dt{
    color:var(--muted);
    font-size:14px;
  }
  dd{
    margin:0;
    font-size:15px;
  }
  ul{
    margin:0;
    padding-left:1.2em;
    font-size:15px;
  }
  li{margin-bottom:6px;}
  a{color:var(--ink);}
  a:focus-visible{
    outline:2px solid var(--ink);
    outline-offset:3px;
  }
  footer{
    margin-top:72px;
    padding-top:24px;
    border-top:1px solid var(--line);
    font-size:13px;
    color:var(--muted);
  }
  footer p{margin:0 0 8px;}
  @media (max-width:520px){
    .wrap{padding:56px 20px 72px;}
    dl{grid-template-columns:1fr;gap:4px;}
    dd{margin-bottom:14px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>E.Universe株式会社</h1>
    <p class="en">E.Universe Inc.</p>
  </header>

  <main>
    <h2>会社概要</h2>
    <dl>
      <dt>商号</dt>
      <dd>E.Universe株式会社</dd>

      <dt>代表者</dt>
      <dd>代表取締役　林 佑典</dd>

      <dt>所在地</dt>
      <dd>愛知県名古屋市中村区名駅4丁目24番5号　第2森ビル401</dd>

      <dt>法人番号</dt>
      <dd>7180001159398</dd>

      <dt>連絡先</dt>
      <dd><a href="mailto:info@euniverse.co.jp">info@euniverse.co.jp</a></dd>
    </dl>

    <h2>事業内容</h2>
    <ul>
      <li>IT・デザイン</li>
      <li>ジュエリーの企画・販売</li>
      <li>メディア運営</li>
      <li>3Dプリント</li>
      <li>ソフトウェア・アプリケーション開発</li>
    </ul>
  </main>

  <footer>
    <p>本ページは暫定版です。正式なコーポレートサイトは準備中です。</p>
    <p>&copy; E.Universe Inc.</p>
  </footer>

</div>
</body>
</html>
